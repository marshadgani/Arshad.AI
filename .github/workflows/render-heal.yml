name: Render Self-Healing Deploy Monitor

# Triggers two ways:
#   1. push — runs immediately when a human/PAT pushes to the production branch.
#   2. schedule — runs every 15 minutes to catch failures from auto-merges made
#      by GITHUB_TOKEN. GitHub blocks push-triggered workflows when the push
#      originates from GITHUB_TOKEN (to prevent infinite loops), so without the
#      schedule, auto-pr.yml merges that break the deploy are never healed.

on:
  push:
    branches:
      - claude/ai-personal-assistant-main
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Queue concurrent runs rather than cancel them — a push-triggered run may
    # be mid-heal and should complete before the next schedule fires.
    concurrency:
      group: render-heal
      cancel-in-progress: false

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAX_HEAL_ATTEMPTS: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Explicit ref ensures schedule-triggered runs always check out the
          # deployed branch, not whatever GitHub's default branch is.
          ref: claude/ai-personal-assistant-main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic httpx

      - name: Wait for Render deploy to complete
        id: wait_deploy
        # Skip on schedule runs — no new deploy was just triggered, so there's
        # nothing to wait for. The heal script checks the current state directly.
        if: github.event_name == 'push'
        run: |
          echo "⏳ Waiting for Render deploy to complete..."
          python3 scripts/render_wait_deploy.py
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ env.RENDER_SERVICE_ID }}

      - name: Self-healing loop
        id: heal_loop
        run: |
          python3 scripts/render_heal.py
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ env.RENDER_SERVICE_ID }}
          RENDER_HEALTH_URL: ${{ env.RENDER_HEALTH_URL }}
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
          MAX_HEAL_ATTEMPTS: ${{ env.MAX_HEAL_ATTEMPTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Report final status
        if: always()
        run: |
          echo "## Render Self-Heal Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/heal_summary.md ]; then
            cat /tmp/heal_summary.md >> $GITHUB_STEP_SUMMARY
          fi
