name: Auto-open PR + auto-merge gate-finished commits

# Triggered on every push to ANY branch except the merge target itself.
# This makes the auto-PR / auto-merge chain work from arbitrary feature
# branches, not just one hardcoded develop branch.
#
# Behaviour:
#   1. Open (or update) a PR from the pushed branch into
#      claude/ai-personal-assistant-main. PR body comes from
#      tasks/last-gate-report.md when present, else a generic template.
#   2. If THIS push contains a fresh gate report (HEAD commit modifies
#      tasks/last-gate-report.md) AND the report's verdict is not
#      "BLOCKED", squash-merge the PR automatically.
#
# Pushes WITHOUT a fresh gate report only update the PR — they never
# auto-merge.
#
# Diagnostic strategy:
#   - Each step appends to BOTH $GITHUB_STEP_SUMMARY (per-step file)
#     AND /tmp/diag.md (job-shared, for the failure step to read).
#   - On failure(), a safety-net step pastes /tmp/diag.md into a
#     comment on the open PR, making the failure visible without
#     log-file auth.
on:
  push:
    branches-ignore:
      - claude/ai-personal-assistant-main
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr-and-merge:
    runs-on: ubuntu-latest
    env:
      DIAG: /tmp/diag.md          # job-shared diagnostic log
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Workflow entry marker
        run: |
          set -uo pipefail
          : > "$DIAG"
          {
            echo "## Workflow entry"
            echo "- Commit: \`$(git log -1 --pretty=%H HEAD)\`"
            echo "- Subject: \`$(git log -1 --pretty=%s HEAD)\`"
            echo "- Files changed in HEAD:"
            git diff-tree --no-commit-id --name-only -r HEAD | sed 's|^|  - |'
            echo
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Build PR title and body
        id: build
        env:
          BASE: claude/ai-personal-assistant-main
        run: |
          set -uo pipefail

          title=$(git log -1 --pretty=%s HEAD)
          echo "title=${title}" >> "$GITHUB_OUTPUT"

          BODY_FILE=tasks/last-gate-report.md
          OUT=$(mktemp)

          if [ -f "$BODY_FILE" ]; then
            cp "$BODY_FILE" "$OUT"
          else
            commits=$(git log --pretty='- %s' "origin/${BASE}..HEAD")
            cat > "$OUT" <<EOF
          ## Summary

          Auto-opened by \`auto-pr\` workflow from a push to \`${GITHUB_REF_NAME}\`.

          No gate report was present (\`tasks/last-gate-report.md\` not committed). Trigger the gate by saying "Merge to Main" in Claude Code so the next push includes the report.

          ## Commits in this PR

          ${commits}
          EOF
          fi

          echo "body_file=${OUT}" >> "$GITHUB_OUTPUT"

          {
            echo "## Build PR title and body"
            echo "- title: \`${title}\`"
            echo "- body file: \`${OUT}\` (size: $(wc -c < "$OUT") bytes)"
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether to auto-merge
        id: gate
        run: |
          set -uo pipefail
          REPORT="tasks/last-gate-report.md"

          changed=$(git diff-tree --no-commit-id --name-only -r HEAD)

          has_report=false
          if printf '%s\n' "${changed}" | grep -qx "${REPORT}"; then
            has_report=true
          fi

          verdict="MISSING"
          if [ -f "${REPORT}" ]; then
            if grep -q "GATE BLOCKED" "${REPORT}"; then
              verdict="BLOCKED"
            elif grep -qE "GATE PASSED" "${REPORT}"; then
              verdict="PASSED"
            else
              verdict="UNKNOWN"
            fi
          fi

          subject=$(git log -1 --pretty=%s HEAD)

          if [ "${has_report}" = "true" ] && [ "${verdict}" = "PASSED" ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
            decision="merge=true"
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
            decision="merge=false"
          fi

          {
            echo "## Auto-merge guard"
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| HEAD modifies \`${REPORT}\` | \`${has_report}\` |"
            echo "| Verdict in report | \`${verdict}\` |"
            echo "| Last commit subject | \`${subject}\` |"
            echo "| **Decision** | **\`${decision}\`** |"
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: claude/ai-personal-assistant-main
          HEAD: ${{ github.ref_name }}
          TITLE: ${{ steps.build.outputs.title }}
          BODY_FILE: ${{ steps.build.outputs.body_file }}
        run: |
          set -uo pipefail

          existing=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number // ""')

          edit_rc=0
          edit_out=""
          create_rc=0
          create_out=""

          if [ -n "$existing" ]; then
            edit_out=$(gh pr edit "$existing" --title "$TITLE" --body-file "$BODY_FILE" 2>&1)
            edit_rc=$?
          else
            create_out=$(gh pr create --base "$BASE" --head "$HEAD" --title "$TITLE" --body-file "$BODY_FILE" 2>&1)
            create_rc=$?
          fi

          PR_NUM=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number // ""')

          {
            echo "## Open or update PR"
            echo "- Initial existing PR query: \`${existing:-<none>}\`"
            if [ -n "$existing" ]; then
              echo "- gh pr edit rc: \`${edit_rc}\`"
              echo "- gh pr edit output:"
              echo
              echo '```'
              echo "${edit_out}"
              echo '```'
            else
              echo "- gh pr create rc: \`${create_rc}\`"
              echo "- gh pr create output:"
              echo
              echo '```'
              echo "${create_out}"
              echo '```'
            fi
            echo "- Authoritative PR number after operation: \`${PR_NUM:-<empty>}\`"
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$PR_NUM" ]; then
            echo "::error::No open PR found after create/update."
            exit 1
          fi

          echo "number=${PR_NUM}" >> "$GITHUB_OUTPUT"

      - name: Auto-merge (squash) if gate-finished
        if: steps.gate.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail

          {
            echo "## Auto-merge result"
            echo "- PR_NUMBER input: \`${PR_NUMBER:-<empty>}\`"
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${PR_NUMBER}" ]; then
            { echo "- :x: PR_NUMBER was empty"; } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Both `gh pr merge` and `gh api PUT /merge` were terminating
          # the shell mid-execution. Use raw curl to bypass gh CLI entirely.
          #
          # Retry loop: GitHub computes mergeable_state asynchronously after
          # a push. The merge endpoint returns 405 "Pull Request is not
          # mergeable" until the computation finishes (typically 2-10 s).
          # We poll the PR mergeable_state until it's clean/unstable, then
          # PUT /merge. Cap at ~60 s of total wait so the workflow doesn't
          # hang indefinitely on a genuinely-not-mergeable state.
          echo "- BEFORE merge retry loop" >> "$DIAG"
          merge_attempts=0
          merge_max_attempts=12        # 12 × 5 s = 60 s ceiling
          merge_sleep=5
          http_code=""
          mergeable_state=""

          while [ "$merge_attempts" -lt "$merge_max_attempts" ]; do
            merge_attempts=$((merge_attempts + 1))

            # Step A: ask GitHub if the PR is currently mergeable.
            pr_state=$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            mergeable=$(printf '%s' "$pr_state" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("mergeable") if d.get("mergeable") is not None else "null")' 2>/dev/null || echo "null")
            mergeable_state=$(printf '%s' "$pr_state" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("mergeable_state",""))' 2>/dev/null || echo "")
            echo "- attempt ${merge_attempts}: mergeable=${mergeable} mergeable_state=${mergeable_state}" >> "$DIAG"

            # `null` = GitHub still computing. Retry.
            if [ "$mergeable" = "null" ]; then
              sleep "$merge_sleep"
              continue
            fi

            # `false` = genuinely not mergeable (conflicts, blocked, draft).
            if [ "$mergeable" = "false" ] || [ "$mergeable_state" = "dirty" ]; then
              http_code="409"
              echo '{"message":"Pull request is not mergeable","mergeable_state":"'"${mergeable_state}"'"}' > /tmp/merge.out
              break
            fi

            # `true` (or any truthy) — try the merge.
            http_code=$(curl -sS -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"merge_method":"squash"}' \
              -o /tmp/merge.out \
              -w "%{http_code}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge")
            echo "- attempt ${merge_attempts}: PUT /merge http=${http_code}" >> "$DIAG"

            # 200 = merged. Exit retry loop.
            if [ "$http_code" = "200" ]; then
              break
            fi

            # 405 = "Pull Request is not mergeable" (transient: GitHub is
            # still indexing). 409 = ref state changed under us (concurrent
            # push). Both are worth retrying.
            if [ "$http_code" = "405" ] || [ "$http_code" = "409" ]; then
              sleep "$merge_sleep"
              continue
            fi

            # Anything else (403, 422, 500) is fatal — don't burn retries.
            break
          done
          echo "- AFTER merge retry loop (attempts=${merge_attempts} http=${http_code})" >> "$DIAG"

          {
            echo "- attempts:       \`${merge_attempts} / ${merge_max_attempts}\`"
            echo "- HTTP status:    \`${http_code}\`"
            echo "- mergeable_state on last poll: \`${mergeable_state}\`"
            echo "- response body:"
            echo
            echo '```json'
            cat /tmp/merge.out 2>/dev/null || echo "(empty)"
            echo '```'
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

          # Exit non-zero if HTTP status is not 200 (success on merge endpoint).
          if [ "$http_code" = "200" ]; then
            exit 0
          else
            exit 1
          fi

      - name: Post diagnostic comment on PR (always)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: claude/ai-personal-assistant-main
          HEAD: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          PR=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number // ""')
          # Also check for closed-just-now PR (auto-merge succeeds → state becomes merged)
          if [ -z "$PR" ]; then
            PR=$(gh pr list --base "$BASE" --head "$HEAD" --state all --limit 1 --json number --jq '.[0].number // ""')
          fi
          if [ -z "$PR" ]; then
            echo "(no PR found — cannot post comment)"
            exit 0
          fi
          run_url="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          {
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "## :white_check_mark: auto-pr workflow succeeded"
            else
              echo "## :x: auto-pr workflow status: \`${JOB_STATUS}\`"
            fi
            echo
            echo "Run: [${RUN_ID}](${run_url})"
            echo
            echo "### Step diagnostics (job-shared log)"
            echo
            if [ -s "$DIAG" ]; then
              cat "$DIAG"
            else
              echo "_(diagnostic log was empty — failure happened before the entry-marker step)_"
            fi
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md || echo "(could not post comment)"
