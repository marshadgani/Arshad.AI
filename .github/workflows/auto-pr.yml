name: Auto-open PR + auto-merge gate-finished commits

# Triggered on every push to claude/ai-personal-assistant-develop-AION.
#
# Behaviour:
#   1. Open (or update) a PR into claude/ai-personal-assistant-main.
#      PR body comes from tasks/last-gate-report.md when present, else
#      a generic template.
#   2. If THIS push contains a fresh gate report (HEAD commit modifies
#      tasks/last-gate-report.md) AND the report's verdict is not
#      "BLOCKED", squash-merge the PR automatically.
#
# Pushes WITHOUT a fresh gate report only update the PR — they never
# auto-merge. This is the safety guard: only "Merge to Main" runs in
# Claude Code (which always writes a fresh report) trigger the merge.
on:
  push:
    branches:
      - claude/ai-personal-assistant-develop-AION

permissions:
  contents: write          # needed for gh pr merge to push the squash commit
  pull-requests: write

jobs:
  open-pr-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR title and body
        id: build
        env:
          BASE: claude/ai-personal-assistant-main
        run: |
          set -euo pipefail

          title=$(git log -1 --pretty=%s HEAD)
          echo "title=${title}" >> "$GITHUB_OUTPUT"

          BODY_FILE=tasks/last-gate-report.md
          OUT=$(mktemp)

          if [ -f "$BODY_FILE" ]; then
            cp "$BODY_FILE" "$OUT"
          else
            commits=$(git log --pretty='- %s' "origin/${BASE}..HEAD")
            cat > "$OUT" <<EOF
          ## Summary

          Auto-opened by \`auto-pr\` workflow from a push to \`claude/ai-personal-assistant-develop-AION\`.

          No gate report was present (\`tasks/last-gate-report.md\` not committed). Trigger the gate by saying "Merge to Main" in Claude Code so the next push includes the report.

          ## Commits in this PR

          ${commits}

          ## Test plan
          - [ ] Vercel preview deploy renders the change
          - [ ] No regression in existing routes
          - [ ] Backend (when deployed) \`/health\` returns 200

          ---
          Manual merge expected. Use **Squash and merge** to match the project's gate convention.
          EOF
          fi

          echo "body_file=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to auto-merge
        id: gate
        run: |
          set -euo pipefail

          # Auto-merge fires only when THIS push contains a fresh gate
          # report AND the report's verdict is not BLOCKED.
          if git log -1 --name-only --pretty=format: HEAD | grep -qx "tasks/last-gate-report.md"; then
            if grep -q "GATE BLOCKED" tasks/last-gate-report.md 2>/dev/null; then
              echo "Gate report present but verdict is BLOCKED — skipping auto-merge."
              echo "merge=false" >> "$GITHUB_OUTPUT"
            else
              echo "Fresh gate report found, verdict is PASS or WARN — auto-merge eligible."
              echo "merge=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No fresh gate report in this push — manual merge required."
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: claude/ai-personal-assistant-main
          HEAD: claude/ai-personal-assistant-develop-AION
          TITLE: ${{ steps.build.outputs.title }}
          BODY_FILE: ${{ steps.build.outputs.body_file }}
        run: |
          set -euo pipefail

          existing=$(gh pr list \
            --base "$BASE" \
            --head "$HEAD" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "PR #${existing} is already open — updating body with the latest gate report."
            gh pr edit "$existing" \
              --title "$TITLE" \
              --body-file "$BODY_FILE"
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
          else
            url=$(gh pr create \
              --base "$BASE" \
              --head "$HEAD" \
              --title "$TITLE" \
              --body-file "$BODY_FILE")
            echo "Opened: ${url}"
            number=$(echo "$url" | grep -oE '[0-9]+$')
            echo "number=${number}" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge (squash) if gate-finished
        if: steps.gate.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          echo "Squash-merging PR #${PR_NUMBER}..."
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch=false \
            --subject "$(gh pr view "$PR_NUMBER" --json title --jq '.title')" \
            --body "Squash-merged automatically after gate verdict ≠ BLOCKED. See PR description for the full gate report."
          echo "✅ PR #${PR_NUMBER} merged into claude/ai-personal-assistant-main."
