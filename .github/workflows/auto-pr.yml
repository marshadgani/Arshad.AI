name: Auto-open PR + auto-merge gate-finished commits

# Triggered on every push to claude/ai-personal-assistant-develop-AION.
#
# Behaviour:
#   1. Open (or update) a PR into claude/ai-personal-assistant-main.
#      PR body comes from tasks/last-gate-report.md when present, else
#      a generic template.
#   2. If THIS push contains a fresh gate report (HEAD commit modifies
#      tasks/last-gate-report.md) AND the report's verdict is not
#      "BLOCKED", squash-merge the PR automatically.
#
# Pushes WITHOUT a fresh gate report only update the PR — they never
# auto-merge.
#
# Diagnostic strategy:
#   - Each step appends to BOTH $GITHUB_STEP_SUMMARY (per-step file)
#     AND /tmp/diag.md (job-shared, for the failure step to read).
#   - On failure(), a safety-net step pastes /tmp/diag.md into a
#     comment on the open PR, making the failure visible without
#     log-file auth.
on:
  push:
    branches:
      - claude/ai-personal-assistant-develop-AION

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr-and-merge:
    runs-on: ubuntu-latest
    env:
      DIAG: /tmp/diag.md          # job-shared diagnostic log
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Workflow entry marker
        run: |
          set -uo pipefail
          : > "$DIAG"
          {
            echo "## Workflow entry"
            echo "- Commit: \`$(git log -1 --pretty=%H HEAD)\`"
            echo "- Subject: \`$(git log -1 --pretty=%s HEAD)\`"
            echo "- Files changed in HEAD:"
            git diff-tree --no-commit-id --name-only -r HEAD | sed 's|^|  - |'
            echo
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Build PR title and body
        id: build
        env:
          BASE: claude/ai-personal-assistant-main
        run: |
          set -uo pipefail

          title=$(git log -1 --pretty=%s HEAD)
          echo "title=${title}" >> "$GITHUB_OUTPUT"

          BODY_FILE=tasks/last-gate-report.md
          OUT=$(mktemp)

          if [ -f "$BODY_FILE" ]; then
            cp "$BODY_FILE" "$OUT"
          else
            commits=$(git log --pretty='- %s' "origin/${BASE}..HEAD")
            cat > "$OUT" <<EOF
          ## Summary

          Auto-opened by \`auto-pr\` workflow from a push to \`claude/ai-personal-assistant-develop-AION\`.

          No gate report was present (\`tasks/last-gate-report.md\` not committed). Trigger the gate by saying "Merge to Main" in Claude Code so the next push includes the report.

          ## Commits in this PR

          ${commits}
          EOF
          fi

          echo "body_file=${OUT}" >> "$GITHUB_OUTPUT"

          {
            echo "## Build PR title and body"
            echo "- title: \`${title}\`"
            echo "- body file: \`${OUT}\` (size: $(wc -c < "$OUT") bytes)"
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether to auto-merge
        id: gate
        run: |
          set -uo pipefail
          REPORT="tasks/last-gate-report.md"

          changed=$(git diff-tree --no-commit-id --name-only -r HEAD)

          has_report=false
          if printf '%s\n' "${changed}" | grep -qx "${REPORT}"; then
            has_report=true
          fi

          verdict="MISSING"
          if [ -f "${REPORT}" ]; then
            if grep -q "GATE BLOCKED" "${REPORT}"; then
              verdict="BLOCKED"
            elif grep -qE "GATE PASSED" "${REPORT}"; then
              verdict="PASSED"
            else
              verdict="UNKNOWN"
            fi
          fi

          subject=$(git log -1 --pretty=%s HEAD)

          if [ "${has_report}" = "true" ] && [ "${verdict}" = "PASSED" ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
            decision="merge=true"
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
            decision="merge=false"
          fi

          {
            echo "## Auto-merge guard"
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| HEAD modifies \`${REPORT}\` | \`${has_report}\` |"
            echo "| Verdict in report | \`${verdict}\` |"
            echo "| Last commit subject | \`${subject}\` |"
            echo "| **Decision** | **\`${decision}\`** |"
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: claude/ai-personal-assistant-main
          HEAD: claude/ai-personal-assistant-develop-AION
          TITLE: ${{ steps.build.outputs.title }}
          BODY_FILE: ${{ steps.build.outputs.body_file }}
        run: |
          set -uo pipefail

          existing=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number // ""')

          edit_rc=0
          edit_out=""
          create_rc=0
          create_out=""

          if [ -n "$existing" ]; then
            edit_out=$(gh pr edit "$existing" --title "$TITLE" --body-file "$BODY_FILE" 2>&1)
            edit_rc=$?
          else
            create_out=$(gh pr create --base "$BASE" --head "$HEAD" --title "$TITLE" --body-file "$BODY_FILE" 2>&1)
            create_rc=$?
          fi

          PR_NUM=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number // ""')

          {
            echo "## Open or update PR"
            echo "- Initial existing PR query: \`${existing:-<none>}\`"
            if [ -n "$existing" ]; then
              echo "- gh pr edit rc: \`${edit_rc}\`"
              echo "- gh pr edit output:"
              echo
              echo '```'
              echo "${edit_out}"
              echo '```'
            else
              echo "- gh pr create rc: \`${create_rc}\`"
              echo "- gh pr create output:"
              echo
              echo '```'
              echo "${create_out}"
              echo '```'
            fi
            echo "- Authoritative PR number after operation: \`${PR_NUM:-<empty>}\`"
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$PR_NUM" ]; then
            echo "::error::No open PR found after create/update."
            exit 1
          fi

          echo "number=${PR_NUM}" >> "$GITHUB_OUTPUT"

      - name: Auto-merge (squash) if gate-finished
        if: steps.gate.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail

          {
            echo "## Auto-merge result"
            echo "- PR_NUMBER input: \`${PR_NUMBER:-<empty>}\`"
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${PR_NUMBER}" ]; then
            { echo "- :x: PR_NUMBER was empty"; } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # `gh pr merge` was terminating the shell mid-execution (see
          # historical "BEFORE gh pr merge" without "AFTER" markers in
          # earlier failure comments on this PR). Use the GitHub REST API
          # directly via `gh api`, which doesn't trigger that path.
          echo "- BEFORE gh api merge" >> "$DIAG"
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            > /tmp/merge.out 2> /tmp/merge.err
          rc=$?
          echo "- AFTER gh api merge (rc=${rc})" >> "$DIAG"

          {
            echo "- gh api merge rc: \`${rc}\`"
            echo "- gh api merge stdout:"
            echo
            echo '```'
            cat /tmp/merge.out 2>/dev/null || echo "(empty)"
            echo '```'
            echo "- gh api merge stderr:"
            echo
            echo '```'
            cat /tmp/merge.err 2>/dev/null || echo "(empty)"
            echo '```'
          } | tee -a "$DIAG" >> "$GITHUB_STEP_SUMMARY"

          exit $rc

      - name: Post diagnostic comment on PR (always)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: claude/ai-personal-assistant-main
          HEAD: claude/ai-personal-assistant-develop-AION
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          PR=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number // ""')
          # Also check for closed-just-now PR (auto-merge succeeds → state becomes merged)
          if [ -z "$PR" ]; then
            PR=$(gh pr list --base "$BASE" --head "$HEAD" --state all --limit 1 --json number --jq '.[0].number // ""')
          fi
          if [ -z "$PR" ]; then
            echo "(no PR found — cannot post comment)"
            exit 0
          fi
          run_url="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          {
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "## :white_check_mark: auto-pr workflow succeeded"
            else
              echo "## :x: auto-pr workflow status: \`${JOB_STATUS}\`"
            fi
            echo
            echo "Run: [${RUN_ID}](${run_url})"
            echo
            echo "### Step diagnostics (job-shared log)"
            echo
            if [ -s "$DIAG" ]; then
              cat "$DIAG"
            else
              echo "_(diagnostic log was empty — failure happened before the entry-marker step)_"
            fi
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md || echo "(could not post comment)"
