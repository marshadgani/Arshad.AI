# Render Blueprint for Arshad.AI backend.
#
# preDeployCommand runs against the live Postgres BEFORE the new instance
# is swapped in — so a failed migration leaves the previous version serving.
#
# `seed_from_mock` is idempotent (UPSERT on slug). Safe to re-run every deploy.
# Remove the seed half of the chain when Phase D lands real ingestion.

services:
  - type: web
    name: arshad-ai-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerBuildTarget: prod
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: BACKEND_URL
        # Set to the full Render URL of arshad-ai-backend, e.g.:
        # https://arshad-ai-backend.onrender.com
        sync: false

  - type: web
    name: arshad-ai-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    preDeployCommand: "alembic upgrade head && python -m scripts.seed_from_mock"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BACKEND_URL
        # e.g. https://arshad-ai-backend.onrender.com
        sync: false
      - key: FRONTEND_URL
        # e.g. https://arshad-ai-frontend.onrender.com
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_ENCRYPTION_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
