# Minimal nginx config for the production frontend container.
# Listens on 8080 because the container runs as a non-root user and cannot bind <1024.

worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: any route that isn't a real file falls back to index.html
        # so client-side React Router can handle it.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
